<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="430" viewBox="0 0 1000 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#151036"/>
      <stop offset="1" stop-color="#0a2233"/>
    </linearGradient>
    <linearGradient id="quote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"><animate attributeName="stop-color" values="#facc15;#f472b6;#60a5fa;#34d399;#facc15" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#60a5fa;#34d399;#facc15;#f472b6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset=".35" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#06b6d4" stop-opacity=".4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>

    <g id="rocket">
      <path fill="url(#flame)" d="M-30 -7 Q-54 0 -30 7 Z">
        <animate attributeName="d" dur=".22s" repeatCount="indefinite"
          values="M-30 -7 Q-54 0 -30 7 Z;M-30 -6 Q-68 0 -30 6 Z;M-30 -7 Q-50 0 -30 7 Z;M-30 -7 Q-54 0 -30 7 Z"/>
      </path>
      <path d="M-20 -9 L-33 -22 L-10 -10 Z" fill="#ef4444"/>
      <path d="M-20 9 L-33 22 L-10 10 Z" fill="#ef4444"/>
      <path d="M-29 -10 L14 -10 Q34 -10 42 0 Q34 10 14 10 L-29 10 Q-33 0 -29 -10 Z" fill="#f1f5f9"/>
      <path d="M14 -10 Q34 -10 42 0 Q34 10 14 10 Z" fill="#ef4444"/>
      <rect x="-29" y="-10" width="6" height="20" rx="2" fill="#94a3b8"/>
      <circle cx="1" cy="0" r="5.5" fill="#38bdf8" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="-0.5" cy="-1.5" r="1.6" fill="#e0f2fe"/>
    </g>

    <path id="orbit" d="M -90 40 C 200 -15, 520 90, 820 36 S 1060 120, 960 230 S 900 410, 620 404 S 200 360, 60 412 S -60 330, -120 270"/>

    <style>
      .row{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}
      .hl{fill:#fde68a;font-weight:800}
      .q{font:800 23px 'Segoe UI',Arial,sans-serif}
      .in{opacity:0;animation:slide 1s cubic-bezier(.2,.8,.2,1) forwards}
      .r1{animation-delay:.3s}.r2{animation-delay:.8s}.r3{animation-delay:1.3s}.r4{animation-delay:1.8s}.r5{animation-delay:2.3s}.r6{animation-delay:2.9s}
      @keyframes slide{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    </style>
  </defs>

  <rect width="1000" height="430" rx="22" fill="url(#bg)"/>
  <circle cx="860" cy="90" r="190" fill="url(#glowA)"><animate attributeName="cy" values="90;140;90" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="120" cy="340" r="170" fill="url(#glowB)"><animate attributeName="cx" values="120;180;120" dur="9s" repeatCount="indefinite"/></circle>

  <g fill="#fff">
    <circle cx="70" cy="28" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="18" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="34" r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="20" r="1.3"><animate attributeName="opacity" values="1;.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="60" r="1.7"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="290" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="410" r="1.6"><animate attributeName="opacity" values=".3;1;.3" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="416" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="190" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <g class="in r1">
    <circle class="pulse" cx="62" cy="86" r="22" fill="#10b981" fill-opacity=".18" stroke="#34d399" stroke-opacity=".6"/>
    <text x="50" y="94" font-size="22">🧾</text>
    <text x="100" y="94" class="row">Nghề nghiệp: <tspan class="hl">Kế toán dịch vụ</tspan></text>
  </g>
  <g class="in r2">
    <circle class="pulse" cx="62" cy="142" r="22" fill="#f59e0b" fill-opacity=".18" stroke="#fbbf24" stroke-opacity=".6"/>
    <text x="50" y="150" font-size="22">🎓</text>
    <text x="100" y="150" class="row">Đang học <tspan class="hl">Văn bằng 2 Kế toán</tspan> — Học viện Tài chính</text>
  </g>
  <g class="in r3">
    <circle class="pulse" cx="62" cy="198" r="22" fill="#a855f7" fill-opacity=".18" stroke="#c084fc" stroke-opacity=".6"/>
    <text x="50" y="206" font-size="22">🤖</text>
    <text x="100" y="206" class="row">Mê AI — tự làm <tspan class="hl">ứng dụng &amp; website</tspan> cho kế toán, làm video, Google</text>
  </g>
  <g class="in r4">
    <circle class="pulse" cx="62" cy="254" r="22" fill="#3b82f6" fill-opacity=".18" stroke="#60a5fa" stroke-opacity=".6"/>
    <text x="50" y="262" font-size="22">🤝</text>
    <text x="100" y="262" class="row">Mục tiêu: xây <tspan class="hl">cộng đồng</tspan> cùng dùng công nghệ để làm việc nhẹ nhàng hơn</text>
  </g>
  <g class="in r5">
    <circle class="pulse" cx="62" cy="310" r="22" fill="#ec4899" fill-opacity=".18" stroke="#f472b6" stroke-opacity=".6"/>
    <text x="50" y="318" font-size="22">🌱</text>
    <text x="100" y="318" class="row"><tspan class="hl">Cùng nhau phát triển</tspan> — có ý tưởng hay cứ góp ý cho mình nhé!</text>
  </g>
  <g class="in r6">
    <text x="100" y="378" class="q" fill="url(#quote)">“Có cách nào để máy làm thay không?” 💡</text>
  </g>

  <g>
    <circle r="5" fill="#fbbf24" opacity=".7"><animateMotion dur="10s" repeatCount="indefinite" begin="-1.30s"><mpath xlink:href="#orbit"/></animateMotion></circle>
    <circle r="4" fill="#fb923c" opacity=".55"><animateMotion dur="10s" repeatCount="indefinite" begin="-1.22s"><mpath xlink:href="#orbit"/></animateMotion></circle>
    <circle r="3.4" fill="#f472b6" opacity=".45"><animateMotion dur="10s" repeatCount="indefinite" begin="-1.14s"><mpath xlink:href="#orbit"/></animateMotion></circle>
    <circle r="2.8" fill="#c084fc" opacity=".35"><animateMotion dur="10s" repeatCount="indefinite" begin="-1.06s"><mpath xlink:href="#orbit"/></animateMotion></circle>
    <circle r="2.2" fill="#60a5fa" opacity=".28"><animateMotion dur="10s" repeatCount="indefinite" begin="-0.98s"><mpath xlink:href="#orbit"/></animateMotion></circle>
    <circle r="1.8" fill="#fff" opacity=".22"><animateMotion dur="10s" repeatCount="indefinite" begin="-0.90s"><mpath xlink:href="#orbit"/></animateMotion></circle>
  </g>
  <g>
    <use xlink:href="#rocket"/>
    <animateMotion dur="10s" repeatCount="indefinite" begin="-1.42s" rotate="auto"><mpath xlink:href="#orbit"/></animateMotion>
  </g>
</svg>
