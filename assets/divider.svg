<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="60" viewBox="0 0 1000 60">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".2" stop-color="#34d399"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset=".8" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset=".35" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#f472b6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <g id="rocket" transform="scale(.6)">
      <path fill="url(#flame)" d="M-30 -7 Q-54 0 -30 7 Z">
        <animate attributeName="d" dur=".2s" repeatCount="indefinite"
          values="M-30 -7 Q-54 0 -30 7 Z;M-30 -6 Q-70 0 -30 6 Z;M-30 -7 Q-54 0 -30 7 Z"/>
      </path>
      <path d="M-20 -9 L-33 -22 L-10 -10 Z" fill="#ef4444"/>
      <path d="M-20 9 L-33 22 L-10 10 Z" fill="#ef4444"/>
      <path d="M-29 -10 L14 -10 Q34 -10 42 0 Q34 10 14 10 L-29 10 Q-33 0 -29 -10 Z" fill="#f1f5f9"/>
      <path d="M14 -10 Q34 -10 42 0 Q34 10 14 10 Z" fill="#ef4444"/>
      <rect x="-29" y="-10" width="6" height="20" rx="2" fill="#94a3b8"/>
      <circle cx="1" cy="0" r="5.5" fill="#38bdf8" stroke="#1e3a8a" stroke-width="2"/>
    </g>
  </defs>
  <rect x="0" y="29" width="1000" height="2" rx="1" fill="url(#line)" opacity=".55"/>
  <g>
    <rect x="-260" y="27" width="240" height="6" rx="3" fill="url(#trail)"/>
    <use xlink:href="#rocket" x="0" y="30"/>
    <animateTransform attributeName="transform" type="translate" values="-60 0;1120 0" dur="4s" repeatCount="indefinite"/>
  </g>
  <g fill="#fde68a">
    <circle cx="200" cy="18" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="4s" begin=".7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="44" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="16" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="42" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="3.1s" repeatCount="indefinite"/></circle>
  </g>
