<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#60a5fa;#a855f7;#ec4899;#34d399" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a855f7;#ec4899;#34d399;#60a5fa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#34d399;#60a5fa;#a855f7;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow3"><stop offset="0" stop-color="#ec4899" stop-opacity=".4"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset=".35" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <g id="rocket">
      <path fill="url(#flame)" d="M-30 -7 Q-54 0 -30 7 Z">
        <animate attributeName="d" dur=".22s" repeatCount="indefinite"
          values="M-30 -7 Q-54 0 -30 7 Z;M-30 -6 Q-70 0 -30 6 Z;M-30 -7 Q-50 0 -30 7 Z;M-30 -7 Q-54 0 -30 7 Z"/>
      </path>
      <path d="M-20 -9 L-33 -22 L-10 -10 Z" fill="#ef4444"/>
      <path d="M-20 9 L-33 22 L-10 10 Z" fill="#ef4444"/>
      <path d="M-29 -10 L14 -10 Q34 -10 42 0 Q34 10 14 10 L-29 10 Q-33 0 -29 -10 Z" fill="#f1f5f9"/>
      <path d="M14 -10 Q34 -10 42 0 Q34 10 14 10 Z" fill="#ef4444"/>
      <rect x="-29" y="-10" width="6" height="20" rx="2" fill="#94a3b8"/>
      <circle cx="1" cy="0" r="5.5" fill="#38bdf8" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="-0.5" cy="-1.5" r="1.6" fill="#e0f2fe"/>
    </g>
    <path id="flight" d="M -120 300 C 260 300, 420 40, 700 120 S 1050 330, 1340 -60"/>
    <style>
      .t1{font:800 64px 'Segoe UI',Arial,sans-serif;letter-spacing:-1px}
      .t2{font:500 22px 'Segoe UI',Arial,sans-serif;fill:#c7d2fe}
      .chip{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#e0e7ff}
      .fade{opacity:0;animation:in 1s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.6s}.d3{animation-delay:1s}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .float{animation:fl 6s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      .caret{animation:bl 1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <circle cx="1020" cy="60" r="220" fill="url(#glow1)">
    <animate attributeName="cx" values="1020;960;1020" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="300" r="200" fill="url(#glow2)">
    <animate attributeName="cy" values="300;260;300" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="330" r="160" fill="url(#glow3)">
    <animate attributeName="r" values="160;190;160" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <circle cx="880" cy="90" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="210" r="2.5"><animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="60" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="270" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="1.5"><animate attributeName="opacity" values="1;0;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <g class="fade d1">
    <text x="70" y="128" class="t2">👋 Xin chào, mình là</text>
  </g>
  <g class="fade d2">
    <text x="66" y="200" class="t1" fill="url(#txt)">Võ Ngọc Lũy</text>
  </g>
  <g class="fade d3">
    <text x="70" y="244" class="t2">Kế toán viên &amp; người mê AI — biến việc lặp lại thành công cụ<tspan class="caret" fill="#a5b4fc"> ▍</tspan></text>
  </g>

  <!-- Floating app badges -->
  <g class="float">
    <g transform="translate(870 120)">
      <rect width="250" height="44" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="22" y="28" class="chip">🧾 Kế toán dịch vụ · 6 công ty</text>
    </g>
  </g>
  <g class="float" style="animation-delay:1.5s">
    <g transform="translate(900 180)">
      <rect width="220" height="44" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="22" y="28" class="chip">🎓 VB2 HV Tài chính</text>
    </g>
  </g>
  <g class="float" style="animation-delay:3s">
    <g transform="translate(930 240)">
      <rect width="190" height="44" rx="22" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>
      <text x="22" y="28" class="chip">🤖 Ngocluytool</text>
    </g>
  </g>

  <!-- Tên lửa bay chéo qua banner, kéo theo vệt sao -->
  <g>
    <circle r="6" fill="#fbbf24" opacity=".7"><animateMotion dur="7s" repeatCount="indefinite" begin="-.88s"><mpath xlink:href="#flight"/></animateMotion></circle>
    <circle r="5" fill="#fb923c" opacity=".55"><animateMotion dur="7s" repeatCount="indefinite" begin="-.80s"><mpath xlink:href="#flight"/></animateMotion></circle>
    <circle r="4" fill="#f472b6" opacity=".45"><animateMotion dur="7s" repeatCount="indefinite" begin="-.72s"><mpath xlink:href="#flight"/></animateMotion></circle>
    <circle r="3" fill="#c084fc" opacity=".35"><animateMotion dur="7s" repeatCount="indefinite" begin="-.64s"><mpath xlink:href="#flight"/></animateMotion></circle>
    <circle r="2.4" fill="#60a5fa" opacity=".28"><animateMotion dur="7s" repeatCount="indefinite" begin="-.56s"><mpath xlink:href="#flight"/></animateMotion></circle>
    <circle r="2" fill="#fff" opacity=".2"><animateMotion dur="7s" repeatCount="indefinite" begin="-.48s"><mpath xlink:href="#flight"/></animateMotion></circle>
  </g>
  <g>
    <use xlink:href="#rocket"/>
    <animateMotion dur="7s" repeatCount="indefinite" begin="-1s" rotate="auto"><mpath xlink:href="#flight"/></animateMotion>
  </g>
</svg>
